[package]
name = "sentinel-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Off by default so the workspace builds and tests without the proprietary
# Ultralight SDK. Enable with `--features ultralight` on a machine where the
# Ultralight shared libraries (UltralightCore, WebCore, Ultralight) are loadable.
default = []
ultralight = ["dep:ul-next", "dep:sentinel-bridge", "dep:sentinel-permissions", "dep:sentinel-ipc"]

[dependencies]
sentinel-core = { path = "../sentinel-core" }
# Pulled in only with the `ultralight` feature (used by the JS bridge module).
sentinel-bridge = { path = "../sentinel-bridge", optional = true }
sentinel-permissions = { path = "../sentinel-permissions", optional = true }
sentinel-ipc = { path = "../sentinel-ipc", optional = true }
# `linked` feature => symbols resolved at build time against ul-next-sys's import
# library (ul-next-sys downloads the matching SDK during its build). The runtime
# `loaded`/GetProcAddress path fails on this SDK build with a symbol mismatch, so
# we link. The crate stays optional, so the workspace builds without ul-next when
# the `ultralight` feature is off. (Browser plugin/page DLL loading — the project's
# "load DLLs directly" goal — is a separate, later subsystem and unaffected.)
ul-next = { version = "0.5.4", features = ["linked"], optional = true }

[dev-dependencies]
# Used by the JS-bridge integration test as a real RequestExecutor + policy.
sentinel-device-host = { path = "../sentinel-device-host" }
sentinel-dll-host = { path = "../sentinel-dll-host" }
sentinel-hosts = { path = "../sentinel-hosts" }
sentinel-permissions = { path = "../sentinel-permissions" }
sentinel-bridge = { path = "../sentinel-bridge" }
