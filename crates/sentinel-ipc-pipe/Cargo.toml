[package]
name = "sentinel-ipc-pipe"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The out-of-process helper executable. Built for the host arch by default; for an
# x86-only vendor SDK, build it with `--target i686-pc-windows-msvc`.
[[bin]]
name = "sentinel-ipc-helper"
path = "src/bin/helper.rs"

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-ipc = { path = "../sentinel-ipc" }
sentinel-plugin = { path = "../sentinel-plugin" }
sentinel-idbox = { path = "../sentinel-idbox" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_IO",
] }
