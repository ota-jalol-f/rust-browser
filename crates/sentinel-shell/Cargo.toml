[package]
name = "sentinel-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "sentinel"
path = "src/main.rs"

[features]
# Off by default so `normalize_url` and the crate build/test without the SDK.
# The windowed browser is gated behind this feature. It renders via the engine's
# low-level Renderer path (ul-next `linked`) and owns the window with winit +
# softbuffer — NOT AppCore, whose overlay views crash on the JS-bridge callback.
default = []
ultralight = [
    "sentinel-engine/ultralight",
    "dep:sentinel-bridge",
    "dep:sentinel-hosts",
    "dep:sentinel-permissions",
    "dep:sentinel-plugin",
    "dep:sentinel-idbox",
    "dep:sentinel-photo",
    "dep:sentinel-signpad",
    "dep:sentinel-device-host",
    "dep:sentinel-dll-host",
    "dep:sentinel-ipc",
    "dep:serde_json",
    "dep:winit",
    "dep:softbuffer",
]

[dependencies]
sentinel-core = { path = "../sentinel-core" }
sentinel-engine = { path = "../sentinel-engine" }
# Native-bridge stack + windowing, pulled in only with the GUI (ultralight) feature.
sentinel-bridge = { path = "../sentinel-bridge", optional = true }
sentinel-hosts = { path = "../sentinel-hosts", optional = true }
sentinel-permissions = { path = "../sentinel-permissions", optional = true }
sentinel-plugin = { path = "../sentinel-plugin", optional = true }
sentinel-idbox = { path = "../sentinel-idbox", optional = true }
sentinel-photo = { path = "../sentinel-photo", optional = true }
sentinel-signpad = { path = "../sentinel-signpad", optional = true }
sentinel-device-host = { path = "../sentinel-device-host", optional = true }
sentinel-dll-host = { path = "../sentinel-dll-host", optional = true }
sentinel-ipc = { path = "../sentinel-ipc", optional = true }
serde_json = { version = "1", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
