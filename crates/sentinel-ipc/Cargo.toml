[package]
name = "sentinel-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }
serde = { workspace = true }
# JSON wire format: human-debuggable. Binary payloads ride as byte arrays; a
# future optimization could swap to bincode without changing the message types.
serde_json = "1"
