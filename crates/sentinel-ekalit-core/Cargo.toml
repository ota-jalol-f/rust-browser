[package]
name = "sentinel-ekalit-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Pure, device-free logic of the reference Asbt.EKalitWebV6.Plugin (the `ekalit`
# host object: E-IMZO / E-Kalit USB-token signing). The parts that do not touch the
# token: the SignStringV2 canonicalisation (the exact string that gets signed), the
# Answere JSON envelope, the ModelSignature / ModelCertificate / ModelStringSign
# models, X.509 certificate parsing, the texts, and the `Signer` seam.
#
# PARITY NOTE: the canonicalisation is pinned byte-for-byte against real Newtonsoft
# output (extracted via a C# repro) for string / int / bool / object / array values.
# Float and auto-parsed ISO-date values render CULTURE-dependently in C#
# (JValue.ToString: "1,5", date formats), which a locale-free Rust port cannot
# reproduce — those cases are a documented divergence (the signed bytes the server
# verifies would differ). There is no C# test suite for this plugin to pin against.
[dependencies]
# preserve_order: nested-object member order must stay document order (only the
# TOP-level object is sorted by name, as C# SumValues does).
serde_json = { version = "1", features = ["preserve_order"] }
x509-parser = "0.16"
