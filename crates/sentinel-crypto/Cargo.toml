[package]
name = "sentinel-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-core = { path = "../sentinel-core" }
# AES-256-GCM authenticated encryption (RustCrypto, audited, pure Rust).
aes-gcm = "0.10"
# Argon2id password-based key derivation (memory-hard).
argon2 = "0.5"
# Wipe key material from memory on drop.
zeroize = { version = "1", features = ["derive"] }
