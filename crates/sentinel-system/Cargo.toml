[package]
name = "sentinel-system"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
sentinel-plugin = { path = "../sentinel-plugin" }
serde_json = "1"
# OS CSPRNG for GetGUID (v4). rand_core 0.6's `getrandom` feature pins
# getrandom 0.2, whose Windows backend (RtlGenRandom / BCryptGenRandom) runs on
# Windows 7 — unlike getrandom 0.3+ (ProcessPrng, Win10+). Do NOT bump to a
# getrandom 0.3/0.4 path: it compiles but fails to load on the Win7 target.
rand_core = { version = "0.6", features = ["getrandom"] }
