[workspace]
resolver = "2"
members = [
    "crates/sentinel-core",
    "crates/sentinel-engine",
    "crates/sentinel-crypto",
    "crates/sentinel-storage",
    "crates/sentinel-shell",
    "crates/sentinel-permissions",
    "crates/sentinel-ipc",
    "crates/sentinel-bridge",
    "crates/sentinel-device-host",
    "crates/sentinel-dll-host",
    "crates/sentinel-test-plugin",
    "crates/sentinel-hosts",
    "crates/sentinel-plugin",
    "crates/sentinel-ipc-pipe",
    "crates/sentinel-idbox-core",
    "crates/sentinel-idbox",
    "crates/sentinel-idbox-helper",
    "crates/sentinel-photo-core",
    "crates/sentinel-photo",
    "crates/sentinel-signpad-core",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
authors = ["Sentinel Browser"]

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
